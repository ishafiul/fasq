name: ecommerce
version: 0.0.2
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"
description: A new Flutter project.
resolution: workspace

dependencies:
  auto_route: ^11.1.0
  dio: ^5.9.2
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  envied: ^1.3.4
  fasq: 0.5.1
  fasq_security: 0.3.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  image_picker: ^1.2.2
  injectable: ^3.0.0
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.5
  json_annotation: ^4.11.0
  logger: ^2.7.0
  luthor: ^0.17.0
  mime: ^2.0.0
  path: ^1.9.1
  photo_view: ^0.15.0
  pinput: ^6.0.2
  path_provider: ^2.1.5
  retrofit: ^4.9.2
  share_plus: ^12.0.2
  stack_trace: ^1.12.1
  stream_transform: ^2.1.1
  cached_network_image: ^3.4.1
  vibration: ^3.1.8
  device_info_plus: ^12.4.0
  flutter_secure_storage: ^10.1.0
  package_info_plus: ^9.0.1

dev_dependencies:
  auto_route_generator: ^10.5.0
  fasq_analysis: 0.0.1
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  envied_generator: ^1.3.4
  fasq_serializer_generator:
    path: ../../packages/fasq_serializer_generator
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.2
  lint: ^2.8.0
  retrofit_generator: ^10.2.6
  swagger_parser: ^1.43.1
  drift_dev: ^2.33.0
  sqflite_common_ffi: ^2.4.0+3

flutter_gen:
  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/muscle_diagram.svg
    - assets/icons/
    - assets/icons/outlined/
    - assets/icons/filled/
    - assets/icons/twotone/
    - assets/fonts/
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/ARIAL.ttf
        - asset: assets/fonts/ARIALBD.ttf
          weight: 700
        - asset: assets/fonts/ARIALI.ttf
          style: italic
        - asset: assets/fonts/ARIALBI.ttf
          weight: 700
          style: italic
