name: fasq
description: FASQ (Flutter Async State Query) delivers caching-first async data management for Flutter with smart refetching, error recovery, and unified APIs.
version: 0.5.0
repository: https://github.com/ishafiul/fasq
issue_tracker: https://github.com/ishafiul/fasq/issues
homepage: https://fasq.shafi.dev

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fasq_analysis: 0.0.1
  fake_async: ^1.3.3
  clock: ^1.1.2

